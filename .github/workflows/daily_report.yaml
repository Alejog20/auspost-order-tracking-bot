name: Daily tracking report

on: 
  schedule: 
  # 2:07 pm Melbourne time, weekdays
  # can be modified, of course
  - cron : "7 14 * * 1-5"
    timezone: "Australia/Melbourne"

  workflow_dispatch: 

  jobs: 
    send-report:
      runs-on: ubuntu-latest
      steps: 
        - uses: actions
            /checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: pip install -r 
            requirements.txt
        - run: python
            run_daily_report.py\
          env: 
            ANTHROPIC_API_KEY:${{secrets.ANTHROPIC_API_KEY}}
            SHOPIFY_STORE_DOMAIN: ${{secrets.SHOPIFY_STORE_DOMAIN}}
            SHOPIFY_CLIENT_ID: ${{secrets.SHOPIFY_CLIENT_ID}}
            SHOPIFY_CLIENT_SECRET: ${{secrets.SHOPIFY_CLIENT_SECRET}}
            AUSPOST_API_KEY: ${{secrets.AUSPOST_API_KEY}}




