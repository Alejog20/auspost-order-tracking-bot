<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px;">
            <tr>
              <td style="padding:24px 32px 0 32px;">
                <img src="cid:report-logo" width="160" height="85" alt="{{ company_name }}" style="display:block; border:0; outline:none; text-decoration:none; max-width:160px; height:auto;">
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 8px 32px;">
                <h1 style="margin:0; font-size:20px; color:#1a1a1a;">{{ report_title }}</h1>
                <p style="margin:4px 0 0 0; font-size:13px; color:#666666;">{{ report_date }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 16px 32px;">
                <p style="margin:0; font-size:15px; color:#1a1a1a;">{{ summary_headline }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 16px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    {% for stat in stats %}
                    <td align="center" style="padding:8px; color:{{ stat.color }}; font-size:13px;">
                      <div style="font-size:20px; font-weight:bold;">{{ stat.count }}</div>
                      {{ stat.label }}
                    </td>
                    {% endfor %}
                  </tr>
                </table>
              </td>
            </tr>
            {% for item in items %}
            <tr>
              <td style="padding:12px 32px; border-top:1px solid #eeeeee;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="font-size:13px; color:#1a1a1a;">
                      <strong>{{ item.tracking_number }}</strong>
                      <span style="display:inline-block; margin-left:8px; padding:2px 8px; border-radius:10px; background-color:{{ item.badge_bg }}; color:{{ item.badge_text }}; font-size:11px;">{{ item.status_label }}</span>
                      <div style="margin-top:4px; color:#444444;">{{ item.narrative }}</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {% endfor %}
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
