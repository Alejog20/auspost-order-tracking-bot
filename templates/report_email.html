<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--[if !mso]><!-->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
    </style>
    <!--<![endif]-->
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f5; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <img src="cid:report-logo" width="180" height="44" alt="{{ company_name }}" style="display:block; border:0; outline:none; text-decoration:none; max-width:180px; height:auto;">
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 6px 32px;">
                <h1 style="margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:20px; font-weight:700; color:#111827; letter-spacing:-0.2px;">{{ report_title }}</h1>
                <p style="margin:4px 0 0 0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:400; color:#6B7280;">{{ report_date }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:10px 32px 20px 32px;">
                <p style="margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:500; color:#1f2937;">{{ summary_headline }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 24px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F9FAFB; border:1px solid #F0F1F3; border-radius:10px;">
                  <tr>
                    {% for stat in stats %}
                    <td align="center" style="padding:14px 4px; {% if not loop.last %}border-right:1px solid #E5E7EB;{% endif %}">
                      <div style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:20px; font-weight:700; color:{{ stat.color }};">{{ stat.count }}</div>
                      <div style="margin-top:2px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11px; font-weight:500; color:#6B7280;">{{ stat.label }}</div>
                    </td>
                    {% endfor %}
                  </tr>
                </table>
              </td>
            </tr>
            {% for item in items %}
            <tr>
              <td style="padding:14px 32px; background-color:{{ '#FAFAFA' if loop.index0 is even else '#FFFFFF' }}; border-top:1px solid #F0F1F3;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; color:#111827;">
                      <span style="font-family:'JetBrains Mono','SF Mono',Consolas,'Roboto Mono',Menlo,monospace; font-size:13px; font-weight:600; color:#111827; letter-spacing:0.2px;">{{ item.tracking_number }}</span>
                      <span style="display:inline-block; margin-left:8px; padding:3px 10px; border-radius:999px; background-color:{{ item.badge_bg }}; color:{{ item.badge_text }}; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11px; font-weight:600;">{{ item.status_label }}</span>
                      <div style="margin-top:6px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:400; color:#6B7280;">{{ item.narrative }}</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {% endfor %}
            <tr>
              <td style="height:8px; line-height:8px; font-size:0;">&nbsp;</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
