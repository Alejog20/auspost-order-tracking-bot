<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

      @page {
        size: A4;
        margin: 2cm;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
      }
      .logo {
        display: block;
        max-width: 180px;
        height: auto;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.2px;
        color: #111827;
        margin-bottom: 0;
      }
      .report-date {
        color: #6B7280;
        font-size: 13px;
        font-weight: 400;
        margin-top: 4px;
      }
      .summary {
        font-size: 15px;
        font-weight: 500;
        color: #1f2937;
        margin: 16px 0;
      }
      .stats {
        display: flex;
        background-color: #F9FAFB;
        border: 1px solid #F0F1F3;
        border-radius: 10px;
        margin-bottom: 24px;
      }
      .stat {
        flex: 1;
        text-align: center;
        padding: 14px 4px;
        border-right: 1px solid #E5E7EB;
      }
      .stat:last-child {
        border-right: none;
      }
      .stat .count {
        font-size: 22px;
        font-weight: 700;
      }
      .stat .label {
        margin-top: 2px;
        font-size: 11px;
        font-weight: 500;
        color: #6B7280;
      }
      .item {
        padding: 12px 0;
        border-top: 1px solid #F0F1F3;
        break-inside: avoid;
      }
      .item:nth-child(even) {
        background-color: #FAFAFA;
      }
      .tracking-number {
        font-family: "JetBrains Mono", "SF Mono", Consolas, "Roboto Mono", Menlo, monospace;
        font-size: 13px;
        font-weight: 600;
        color: #111827;
        letter-spacing: 0.2px;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        margin-left: 8px;
      }
      .narrative {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 400;
        color: #6B7280;
      }
    </style>
  </head>
  <body>
    <h1>{{ report_title }}</h1>
    <div class="report-date">{{ report_date }}</div>
    <p class="summary">{{ summary_headline }}</p>

    <div class="stats">
      {% for stat in stats %}
      <div class="stat">
        <div class="count" style="color:{{ stat.color }};">{{ stat.count }}</div>
        <div class="label">{{ stat.label }}</div>
      </div>
      {% endfor %}
    </div>

    {% for item in items %}
    <div class="item">
      <span class="tracking-number">{{ item.tracking_number }}</span>
      <span class="badge" style="background-color:{{ item.badge_bg }}; color:{{ item.badge_text }};">{{ item.status_label }}</span>
      <div class="narrative">{{ item.narrative }}</div>
    </div>
    {% endfor %}
  </body>
</html>
